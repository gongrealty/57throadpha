# Reads the X-Sense sensors and stores the readings in Supabase.
# Goes in .github/workflows/ of the repo. Needs four repo secrets:
#   XSENSE_EMAIL, XSENSE_PASSWORD, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#
# Cadence note: this repo is PUBLIC, so Actions minutes are unlimited. We run
# every 30 minutes (:07 and :37) -- plenty for a slow-moving indoor temperature,
# and it keeps the 24-hour high/low populated. GitHub still delays/drops
# scheduled runs under load (best-effort cron); two attempts an hour keeps
# readings landing even when one is skipped.
name: X-Sense sensor collect

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes, at :07 and :37 past (UTC)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

concurrency:
  group: xsense-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/xsense/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/xsense/requirements.txt

      - name: Collect readings
        env:
          XSENSE_EMAIL: ${{ secrets.XSENSE_EMAIL }}
          XSENSE_PASSWORD: ${{ secrets.XSENSE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/xsense/collect.py
