# Reads the X-Sense sensors and stores the readings in Supabase.
# Goes in .github/workflows/ of the repo. Needs four repo secrets:
#   XSENSE_EMAIL, XSENSE_PASSWORD, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#
# TRIGGERING: the reliable hourly trigger is an external Supabase pg_cron job
# that calls this workflow's workflow_dispatch API on the hour (GitHub's own
# scheduled cron proved unreliable -- it dropped ~85% of runs, leaving multi-hour
# gaps). The `schedule` below is kept only as a best-effort backup so some data
# still lands if the external trigger is ever down. Repo is PUBLIC = unlimited
# Actions minutes, so an occasional extra run is harmless.
name: X-Sense sensor collect

on:
  workflow_dispatch:         # the reliable path: fired hourly by Supabase pg_cron, and by hand
  schedule:
    - cron: "17 * * * *"     # hourly backup only, at :17 past (UTC) -- best-effort

concurrency:
  group: xsense-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/xsense/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/xsense/requirements.txt

      - name: Collect readings
        env:
          XSENSE_EMAIL: ${{ secrets.XSENSE_EMAIL }}
          XSENSE_PASSWORD: ${{ secrets.XSENSE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/xsense/collect.py
